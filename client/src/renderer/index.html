<!doctype html>
<meta charset="utf-8" />
<title>Matic Desk</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b24; --panel-2: #1b2330; --line: #26303d;
    --fg: #e6edf3; --dim: #8b98a5; --accent: #7cd8f5; --violet: #a78bfa;
    --ok: #6ee7a8; --warn: #f0c27a; --err: #f08a80;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: grid; grid-template-columns: 300px 1fr 340px;
  }
  .col { min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .col + .col { border-left: 1px solid var(--line); }

  /* ---- left: avatar ---- */
  #left { align-items: center; padding: 20px 16px; background: var(--panel); gap: 10px; }
  .brand { font-weight: 600; letter-spacing: .04em; font-size: 13px; color: var(--dim); text-transform: uppercase; }
  #state { font: 12px var(--mono); color: var(--accent); }
  .pill { font: 11px var(--mono); padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
  .pill.on { color: var(--ok); border-color: #2c5c43; }
  .pill.off { color: var(--warn); border-color: #5c4a2c; }
  .pill.bad { color: var(--err); border-color: #5c3230; }
  #facts { width: 100%; margin-top: 8px; font: 11px/1.7 var(--mono); color: var(--dim); }
  #facts div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0; }
  #facts b { color: var(--fg); font-weight: 500; }

  /* ---- middle: transcript ---- */
  #mid { background: var(--bg); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #23405c; }
  /* MUST come before any rule that sets `display` on a toggled element. The [hidden] attribute
     is styled by the UA stylesheet, so ANY class selector setting `display` beats it and el.hidden
     silently stops working - which is exactly what happened to the consent card's details panel:
     `.explain { display: flex }` meant it was always open and the button only changed its label. */
  [hidden] { display: none !important; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); }
  .msg.sys { align-self: center; max-width: 92%; background: transparent; border: 1px dashed var(--line);
             color: var(--dim); font: 12px var(--mono); }
  .msg.sys.bad { color: var(--err); border-color: #5c3230; }
  .msg.sys.good { color: var(--ok); border-color: #2c5c43; }
  #composer { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
           padding: 10px 12px; border-radius: 8px; font: inherit; }
  #input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
           padding: 9px 15px; border-radius: 8px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #1e4d3a; border-color: #2c5c43; color: var(--ok); }
  button.danger  { background: #4a2320; border-color: #5c3230; color: var(--err); }

  /* ---- right: broker inspector ---- */
  #right { background: var(--panel); }
  .hd { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 12px;
        text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  #inspector { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
  .card h4 { margin: 0; padding: 8px 11px; font-size: 11px; text-transform: uppercase;
             letter-spacing: .05em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .card pre { margin: 0; padding: 11px; font: 11px/1.55 var(--mono); overflow-x: auto; color: #b9c6d3; }
  .tier { float: right; font: 10px var(--mono); padding: 1px 6px; border-radius: 8px; }
  .tier.R1 { color: var(--ok); border: 1px solid #2c5c43; }
  .tier.R2 { color: var(--warn); border: 1px solid #5c4a2c; }
  .warn-box { font-size: 12px; color: var(--warn); background: #2e2517; border: 1px solid #5c4a2c;
              border-radius: 6px; padding: 8px 10px; }

  /* Consent sits INLINE in the conversation, not in the inspector. It is the most important
     interaction in the app and must never be below a fold. */
  .consent { align-self: stretch; border: 1px solid var(--accent); border-radius: 12px;
             background: #14202b; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .consent .title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .consent .what { font-size: 14px; }
  .consent .row { display: flex; gap: 10px; }
  .consent .row button { flex: 1; padding: 11px; font-weight: 600; }
  .consent.resolved { border-color: var(--line); opacity: .75; }
  .consent .outcome { font: 12px var(--mono); color: var(--dim); }
  .consent .explain-btn { align-self: flex-start; padding: 7px 12px; font-size: 13px;
        background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; }
  .consent .explain-btn:hover { border-color: var(--accent); color: var(--accent); }
  .explain { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--accent);
        padding: 2px 0 2px 12px; }
  .explain h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--dim); font-weight: 600; }
  .explain p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.5; }
  .explain .danger-note p { color: var(--warn); }
  /* Guidance the USER has to act on. Deliberately shaped like the consent card, because that
     is already the visual language for "this needs you", and deliberately NOT .msg.sys, which
     reads as logging - a user missed the checks entirely when they were styled that way. */
  .todo { align-self: stretch; border: 1px solid var(--warn); border-radius: 12px;
          background: #241d10; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .todo .title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); }
  .todo ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 9px; }
  .todo li { font-size: 14px; }
  .todo li b { display: block; font-weight: 600; }
  .todo li span { color: var(--dim); font-size: 13px; }
  .todo .next { font-size: 13px; color: var(--fg); border-top: 1px solid #4a3d22; padding-top: 10px; }
  /* The ticket review card (D213). Shaped like the consent card because that is already this
     app's visual language for "this needs a decision from you", but in a DIFFERENT colour and
     with a different title, because it is a different decision: the consent card means "change
     something on this machine" and this one means "send this off the machine". Making them look
     identical would blur the one distinction the user most needs to see (D198's neighbourhood). */
  .ticket { align-self: stretch; border: 1px solid var(--ok); border-radius: 12px;
            background: #131f1a; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ticket .title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ok); }
  .ticket .lede { font-size: 13px; color: var(--dim); }
  .ticket .fields { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 7px 12px; align-items: start; }
  .ticket label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim);
            padding-top: 7px; }
  .ticket input, .ticket textarea { width: 100%; box-sizing: border-box; padding: 6px 9px;
            background: #0d1117; color: var(--fg); border: 1px solid var(--line); border-radius: 7px;
            font: 13px/1.45 inherit; }
  .ticket textarea { resize: vertical; min-height: 44px; }
  .ticket input:focus, .ticket textarea:focus { outline: none; border-color: var(--ok); }
  .ticket .fixed { font: 12px var(--mono); color: var(--dim); padding-top: 7px; }
  .ticket .row { display: flex; gap: 10px; }
  .ticket .row button { flex: 1; padding: 11px; font-weight: 600; }
  .ticket.resolved { border-color: var(--line); opacity: .75; }
  .ticket .outcome { font: 12px var(--mono); color: var(--dim); }
  /* The standing caveat, in the card rather than only in a log line: this is where a user decides
     whether to send, so it is where the limits of what sending achieves have to be readable. */
  .ticket .caveat { font-size: 12px; color: var(--warn); border-top: 1px solid #2c5c43; padding-top: 9px; }
  #devlog { max-height: 150px; overflow-y: auto; padding: 8px 11px; font: 10px/1.5 var(--mono);
            color: #6b7684; border-top: 1px solid var(--line); white-space: pre-wrap; }
</style>

<div class="col" id="left">
  <div class="brand">Matic Desk</div>
  <!-- The bust avatar (D232). Full bust at 200px on the dark panel, so the field is knocked out
       (v7 §05). State is driven by renderer.js through `.state`; the element reads everything else
       from the manifest. -->
  <matic-avatar id="avatar" state="idle" size="200" theme="dark"></matic-avatar>
  <div id="state">idle</div>
  <span class="pill" id="voicePill">voice: checking…</span>
  <!-- D49's three connectivity states, from HubLink (D233). Not a reachability guess: it says
       what the link last saw and when. -->
  <span class="pill" id="hubPill" title="hub connectivity">hub: checking…</span>
  <div id="facts"></div>
</div>

<div class="col" id="mid">
  <div id="log"></div>
  <div id="composer">
    <input id="input" autocomplete="off" placeholder="Describe the problem — e.g. “my printer isn't working”" />
    <button id="send">Send</button>
  </div>
</div>

<div class="col" id="right">
  <div class="hd">Broker inspector</div>
  <div id="inspector">
    <div class="card">
      <h4>Proposal</h4>
      <pre id="proposalJson">—  the model proposes; it never executes.</pre>
    </div>
    <div class="card">
      <h4>Validation</h4>
      <pre id="validationJson">—</pre>
    </div>
    <div class="card">
      <h4>Consent</h4>
      <pre id="consentJson">—</pre>
    </div>
    <div class="card">
      <h4>Execution</h4>
      <pre id="executionJson">—</pre>
    </div>
  </div>
  <div id="devlog"></div>
</div>

<script type="module" src="./avatar/matic-avatar-element.js"></script>
<script type="module" src="./renderer.js"></script>

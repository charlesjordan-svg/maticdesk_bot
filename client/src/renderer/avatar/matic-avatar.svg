    <g clip-path="url(#clip-torso)">
      <rect x="60" y="143" width="104" height="70" transform="rotate(9 112 178)" fill="var(--matic-avatar-shell-shade, #d9e0e7)"></rect>
    </g>
  </g>

  <path id="shoulder-cap-left" d="M42 177 A11 11 0 0 1 53 166 A11 11 0 0 1 65 177 V200 H42 Z" fill="var(--matic-avatar-ink, #1b3556)"></path>
  <path id="shoulder-cap-right" d="M135 177 A11 11 0 0 1 146 166 A11 11 0 0 1 158 177 V200 H135 Z" fill="var(--matic-avatar-ink, #1b3556)"></path>

  
  <g id="chest-mark" class="mav-mark">
    <polygon points="100,160 113,167.25 113,181.75 100,189 87,181.75 87,167.25" fill="var(--matic-avatar-mark, var(--matic-avatar-mark-default, #1f5fa8))"></polygon>
    <polygon points="100,162.5 110.5,168.4 110.5,180.6 100,186.5 89.5,180.6 89.5,168.4" fill="var(--matic-avatar-shell, #fdfefe)"></polygon>
    <text x="100" y="179.5" text-anchor="middle" font-family="'Barlow Condensed', 'Barlow Semi Condensed', system-ui, sans-serif" font-weight="600" font-size="16" fill="var(--matic-avatar-mark, var(--matic-avatar-mark-default, #1f5fa8))">M</text>
  </g>

  

  
  
  <g id="badge" class="mav-badge">
    <circle cx="171" cy="37" r="15" fill="var(--matic-avatar-mark, var(--matic-avatar-mark-default, #1f5fa8))"></circle>

    <path id="badge-tick" class="mav-badge-glyph" data-glyph="tick" d="M164 37.5 L169 42.5 L178.5 32" fill="none" stroke="var(--matic-avatar-badge-ink, #fdfefe)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

    <text id="badge-question" class="mav-badge-glyph" data-glyph="question" x="171" y="43.5" text-anchor="middle" font-family="'Barlow', system-ui, sans-serif" font-weight="600" font-size="18" fill="var(--matic-avatar-badge-ink, #fdfefe)">?</text>

    <path id="badge-arrow" class="mav-badge-glyph" data-glyph="arrow" d="M171 45 L171 29 M164.5 35.5 L171 29 L177.5 35.5" fill="none" stroke="var(--matic-avatar-badge-ink, #fdfefe)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

    <text id="badge-bang" class="mav-badge-glyph" data-glyph="bang" x="171" y="43.5" text-anchor="middle" font-family="'Barlow', system-ui, sans-serif" font-weight="700" font-size="19" fill="var(--matic-avatar-badge-ink, #fdfefe)">!</text>
  </g>

  
  <g id="thinking-dots" class="mav-dots" fill="var(--matic-avatar-tip-thinking, #a78bfa)">
    <circle class="acc-dot" cx="154" cy="40" r="4"></circle>
    <circle class="acc-dot" cx="168" cy="40" r="4"></circle>
    <circle class="acc-dot" cx="182" cy="40" r="4"></circle>
  </g>

  
  <g id="ear-rings" class="mav-rings" fill="none" stroke="var(--matic-avatar-accent-scan, #7cd8f5)" stroke-width="3">
    <ellipse cx="39" cy="106" rx="17" ry="22"></ellipse>
    <ellipse cx="161" cy="106" rx="17" ry="22"></ellipse>
  </g>

  
  <g id="ticket" class="mav-ticket" transform="rotate(-8 169 152)">
    <rect x="146" y="136" width="46" height="32" fill="var(--matic-avatar-paper, #f2f2f3)" stroke="var(--matic-avatar-paper-edge, #416180)" stroke-width="2"></rect>
    <rect x="152" y="142" width="34" height="2" fill="var(--matic-avatar-paper-line, #5980a6)"></rect>
    <rect x="152" y="148" width="27" height="2" fill="var(--matic-avatar-paper-line-dim, #b7b7ba)"></rect>
    <rect x="152" y="154" width="20" height="2" fill="var(--matic-avatar-paper-line-dim, #b7b7ba)"></rect>
  </g>

  
  <g id="chest-aperture" class="mav-aperture">
    <polygon points="100,156 117,165.25 117,183.75 100,193 83,183.75 83,165.25" fill="none" stroke="var(--matic-avatar-mark, var(--matic-avatar-mark-default, #1f5fa8))" stroke-width="3" stroke-dasharray="6 5"></polygon>
  </g>
  <rect id="chest-slot" class="mav-slot" x="90" y="171" width="20" height="7" rx="3.5" fill="var(--matic-avatar-mark, var(--matic-avatar-mark-default, #1f5fa8))"></rect>

  
  <g id="ingest-document" class="mav-doc">
    <rect x="88" y="158" width="24" height="30" fill="var(--matic-avatar-paper, #f2f2f3)" stroke="var(--matic-avatar-paper-edge, #416180)" stroke-width="2"></rect>
    <rect x="92" y="163" width="16" height="2" fill="var(--matic-avatar-paper-line, #5980a6)"></rect>
    <rect x="92" y="168" width="11" height="2" fill="var(--matic-avatar-paper-line-dim, #b7b7ba)"></rect>
    <rect x="92" y="173" width="14" height="2" fill="var(--matic-avatar-paper-line-dim, #b7b7ba)"></rect>
  </g>

</svg>
<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" id="matic-avatar" class="mav" viewBox="0 0 200 200" width="200" height="200" role="img" data-state="idle" aria-label="Matic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    
    <clipPath id="clip-helmet">
      <path d="M46 91 A47 47 0 0 1 93 44 H107 A47 47 0 0 1 154 91 V119 A30 30 0 0 1 124 149 H76 A30 30 0 0 1 46 119 Z"></path>
    </clipPath>
    <clipPath id="clip-torso">
      <path d="M44 179 A26 26 0 0 1 70 153 H130 A26 26 0 0 1 156 179 V200 H44 Z"></path>
    </clipPath>
    <clipPath id="clip-face">
      <rect x="56" y="60" width="88" height="76" rx="23"></rect>
    </clipPath>
  </defs>

  

  
  <circle id="field" cx="100" cy="98" r="86" fill="var(--matic-avatar-field, #cbe3f7)"></circle>

  
  <g id="rig" class="mav-rig">

    <rect id="antenna-stem" x="98" y="32" width="4" height="28" rx="2" fill="var(--matic-avatar-ink, #1b3556)"></rect>

    
    <circle id="tip" class="mav-tip" cx="100" cy="25" r="11" fill="var(--matic-avatar-tip, var(--matic-avatar-tip-default, #3f7fc4))"></circle>

    <g id="ear-pod-left">
      <rect x="33" y="85" width="24" height="40" rx="9" fill="var(--matic-avatar-pod, #3f7fc4)"></rect>
      <rect x="37" y="90" width="9" height="30" rx="5" fill="var(--matic-avatar-pod-inner, #5c9ad9)"></rect>
    </g>
    <g id="ear-pod-right">
      <rect x="143" y="85" width="24" height="40" rx="9" fill="var(--matic-avatar-pod, #3f7fc4)"></rect>
      <rect x="154" y="90" width="9" height="30" rx="5" fill="var(--matic-avatar-pod-inner, #5c9ad9)"></rect>
    </g>

    <g id="helmet">
      <path d="M46 91 A47 47 0 0 1 93 44 H107 A47 47 0 0 1 154 91 V119 A30 30 0 0 1 124 149 H76 A30 30 0 0 1 46 119 Z" fill="var(--matic-avatar-shell, #fdfefe)"></path>
      <g clip-path="url(#clip-helmet)">
        <rect x="52" y="-14" width="110" height="150" transform="rotate(9 107 61)" fill="var(--matic-avatar-shell-shade, #d9e0e7)"></rect>
      </g>
    </g>

    
    <g id="face-screen" class="mav-face">
      <rect x="56" y="60" width="88" height="76" rx="23" fill="var(--matic-avatar-ink, #1b3556)"></rect>

      <g clip-path="url(#clip-face)">

        
        <g id="eyes" class="mav-eyes" fill="var(--matic-avatar-eye, var(--matic-avatar-eye-default, #bfe4f7))">

          <g class="eye-shape" data-shape="oval">
            <rect x="68" y="76" width="18" height="23" rx="9"></rect>
            <rect x="114" y="76" width="18" height="23" rx="9"></rect>
          </g>

          <g class="eye-shape" data-shape="round">
            <circle cx="77.5" cy="88.5" r="9.5"></circle>
            <circle cx="122.5" cy="88.5" r="9.5"></circle>
          </g>

          
          <g class="eye-shape" data-shape="happy" fill="none" stroke="var(--matic-avatar-eye, var(--matic-avatar-eye-default, #bfe4f7))" stroke-width="3" stroke-linecap="round">
            <path d="M69.5 91.5 A8 8.5 0 0 1 85.5 91.5"></path>
            <path d="M114.5 91.5 A8 8.5 0 0 1 130.5 91.5"></path>
          </g>

          <g class="eye-shape" data-shape="lowered">
            <rect x="68" y="86" width="18" height="7" rx="3.5" transform="rotate(10 77 89.5)"></rect>
            <rect x="114" y="86" width="18" height="7" rx="3.5" transform="rotate(-10 123 89.5)"></rect>
          </g>

          <g class="eye-shape" data-shape="cross">
            <rect x="68" y="85.5" width="16" height="3" rx="1.5" transform="rotate(45 76 87)"></rect>
            <rect x="68" y="85.5" width="16" height="3" rx="1.5" transform="rotate(-45 76 87)"></rect>
            <rect x="116" y="85.5" width="16" height="3" rx="1.5" transform="rotate(45 124 87)"></rect>
            <rect x="116" y="85.5" width="16" height="3" rx="1.5" transform="rotate(-45 124 87)"></rect>
          </g>
        </g>

        
        <g id="mouth" class="mav-mouth">

          
          <path class="mouth-shape" data-shape="smile" d="M88.5 106.5 A12 11 0 0 0 111.5 106.5" fill="none" stroke="var(--matic-avatar-eye, #bfe4f7)" stroke-width="3" stroke-linecap="round"></path>

          <path class="mouth-shape" data-shape="grin" d="M84.5 104.5 A16 16 0 0 0 115.5 104.5" fill="none" stroke="var(--matic-avatar-eye, #bfe4f7)" stroke-width="3" stroke-linecap="round"></path>

          <path class="mouth-shape" data-shape="closed" d="M89.5 109.5 A11 6 0 0 0 110.5 109.5" fill="none" stroke="var(--matic-avatar-eye, #bfe4f7)" stroke-width="3" stroke-linecap="round"></path>

          <rect class="mouth-shape" data-shape="narrow" x="93" y="110" width="14" height="4" rx="2" fill="var(--matic-avatar-eye, #bfe4f7)"></rect>

          <rect class="mouth-shape" data-shape="wideFlat" x="85" y="109" width="30" height="5" rx="2.5" fill="var(--matic-avatar-eye, #bfe4f7)"></rect>

          <circle class="mouth-shape" data-shape="roundSmall" cx="100" cy="112" r="5.5" fill="none" stroke="var(--matic-avatar-eye, #bfe4f7)" stroke-width="3"></circle>

          <ellipse class="mouth-shape" data-shape="roundLarge" cx="100" cy="113" rx="10.5" ry="9.5" fill="none" stroke="var(--matic-avatar-eye, #bfe4f7)" stroke-width="3"></ellipse>

          <ellipse class="mouth-shape" data-shape="open" cx="100" cy="113" rx="15" ry="11" fill="var(--matic-avatar-eye, #bfe4f7)"></ellipse>

          
          <rect class="mouth-shape mav-talk" data-shape="talk" id="mouth-talk" x="92" y="104" width="16" height="13" rx="3" fill="var(--matic-avatar-eye, #bfe4f7)"></rect>
        </g>

        
        <rect id="scan-line" class="mav-scan" x="56" y="68" width="88" height="3" fill="var(--matic-avatar-accent-scan, #7cd8f5)"></rect>
